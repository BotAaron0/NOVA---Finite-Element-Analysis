[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverseglazesimple"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "Pillow>=10,<14", "pdfplumber>=0.11,<1", "pypdfium2>=4,<6"]

[project.scripts]
glaze-match = "glaze_matcher.cli:main"

[tool.setuptools.packages.find]
include = ["glaze_matcher*"]
